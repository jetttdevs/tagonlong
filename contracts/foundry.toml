[profile.default]
src = "."
test = "."
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Deterministic vault addresses are the point of this design, and the init code
# hash depends on these settings. Change the optimizer and every vault address
# changes — test with exactly what you deploy with.

[rpc_endpoints]
testnet = "https://rpc.testnet.chain.robinhood.com"
mainnet = "https://rpc.mainnet.chain.robinhood.com"
